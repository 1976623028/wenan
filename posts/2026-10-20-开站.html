<h1>开站</h1>
<div class="meta">2026 年 10 月 20 日 · 约 1 分钟 · 随笔</div>
<p>短视频只有六十秒，很多话塞不进去。开这个站，是为了让它们有个地方待着。</p>
<p>这里会放三类东西：</p>
<ol><li><strong>短剧连载</strong>——那些在抖音和小红书上被切成一集一集的故事，完整版放这儿；</li><li><strong>口播稿</strong>——写完但没用上的，或者用了还想留个底稿的；</li><li><strong>随笔</strong>——想到什么写什么，不保证有用。</li></ol>
<p>更新不会很勤。但写下来的，都是我自己认的。</p>
